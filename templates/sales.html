{% extends "base.html" %}{% block content %}<h1>Sales History</h1><div class="card"><table><tr><th>Sale</th><th>Customer</th><th>Payment</th><th>Total</th><th>Date</th><th></th></tr>{% for s in sales %}<tr><td>#{{s.id}}</td><td>{{s.customer}}</td><td>{{s.payment_method}}</td><td>KSh {{'%.2f'|format(s.total)}}</td><td>{{s.created_at}}</td><td><a href="{{url_for('receipt',sid=s.id)}}">Receipt</a></td></tr>{% endfor %}</table></div>{% endblock %}
