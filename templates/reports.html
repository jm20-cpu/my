{% extends "base.html" %}{% block content %}<h1>Reports</h1><div class="grid"><div class="stat"><b>{{summary.count}}</b><span>Sales today</span></div><div class="stat"><b>KSh {{'%.2f'|format(summary.revenue)}}</b><span>Revenue today</span></div></div><div class="card"><h2>Best-selling products</h2><table><tr><th>Product</th><th>Units</th><th>Revenue</th></tr>{% for p in best %}<tr><td>{{p.name}}</td><td>{{p.qty}}</td><td>KSh {{'%.2f'|format(p.revenue)}}</td></tr>{% endfor %}</table></div>{% endblock %}
