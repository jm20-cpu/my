{% extends "base.html" %}{% block content %}<div class="row"><h1>Customers</h1><a class="button" href="{{url_for('add_customer')}}">+ Add Customer</a></div><div class="card"><table><tr><th>Name</th><th>Phone</th><th>Email</th><th>Balance</th></tr>{% for c in customers %}<tr><td>{{c.name}}</td><td>{{c.phone}}</td><td>{{c.email}}</td><td>KSh {{'%.2f'|format(c.balance)}}</td></tr>{% endfor %}</table></div>{% endblock %}
