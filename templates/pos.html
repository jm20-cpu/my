{% extends "base.html" %}{% block content %}<h1>Point of Sale</h1><div class="pos"><div class="card"><input id="search" placeholder="Search products..." oninput="filterProducts()"><div id="plist">{% for p in products %}<button class="product" data-name="{{p.name|lower}}" onclick="addItem({{p.id}},{{p.sell_price}},{{p.stock}},{{p.name|tojson}})"><b>{{p.name}}</b><span>KSh {{'%.2f'|format(p.sell_price)}} · Stock {{p.stock}}</span></button>{% endfor %}</div></div>
<div class="card"><h2>Cart</h2><div id="cart"></div><hr><label>Customer</label><select id="customer"><option value="">Walk-in customer</option>{% for c in customers %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select><label>Payment</label><select id="payment"><option>Cash</option><option>Mobile Money</option><option>Card</option><option>Credit</option></select><h2>Total: KSh <span id="total">0.00</span></h2><button onclick="checkout()">Complete Sale</button></div></div><script src="{{url_for('static',filename='script.js')}}"></script>{% endblock %}
