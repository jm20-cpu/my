{% extends "base.html" %}{% block content %}<div class="card formcard"><h1>{{'Edit' if product else 'Add'}} Product</h1><form method="post">
<label>Name</label><input name="name" required value="{{product.name if product else ''}}"><label>SKU / Barcode</label><input name="sku" value="{{product.sku if product else ''}}">
<label>Category</label><input name="category" value="{{product.category if product else ''}}"><label>Buying price (KSh)</label><input name="buy_price" type="number" step="0.01" value="{{product.buy_price if product else 0}}">
<label>Selling price (KSh)</label><input name="sell_price" type="number" step="0.01" value="{{product.sell_price if product else 0}}"><label>Stock</label><input name="stock" type="number" value="{{product.stock if product else 0}}">
<label>Low-stock threshold</label><input name="low_stock" type="number" value="{{product.low_stock if product else 5}}"><button>Save Product</button></form></div>{% endblock %}
