<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title or "Retail Shop" }}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body>{% if session.get('user_id') %}<aside><h2>🛍️ Retail Shop</h2>
<nav><a href="{{url_for('dashboard')}}">Dashboard</a><a href="{{url_for('pos')}}">POS / Sales</a><a href="{{url_for('products')}}">Products</a><a href="{{url_for('customers')}}">Customers</a><a href="{{url_for('sales')}}">Sales History</a><a href="{{url_for('reports')}}">Reports</a><a href="{{url_for('logout')}}">Logout</a></nav></aside>{% endif %}
<main class="{{ 'withnav' if session.get('user_id') else '' }}">{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
