<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="auth-page">

<div class="auth-box">

    <h1>Create Account</h1>

    <p>Join us today</p>


    {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

    {% endif %}


    <form method="POST"
          action="{{ url_for('signup') }}">

        <input
            type="text"
            name="name"
            placeholder="Full Name"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Email address"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            minlength="6"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>


    <p>
        Already have an account?

        <a href="{{ url_for('login') }}">
            Login
        </a>
    </p>


    <a href="{{ url_for('home') }}">
        ← Back to Website
    </a>

</div>

</body>

</html>
