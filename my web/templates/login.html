<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="auth-page">

<div class="auth-box">

    <h1>Welcome Back</h1>

    <p>Login to your account</p>


    {% if registered %}

        <div class="success-message">
            Account created successfully!
        </div>

    {% endif %}


    {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

    {% endif %}


    <form method="POST"
          action="{{ url_for('login') }}">

        <input
            type="email"
            name="email"
            placeholder="Email address"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>


    <p>
        Don't have an account?

        <a href="{{ url_for('signup') }}">
            Create one
        </a>
    </p>


    <a href="{{ url_for('home') }}">
        ← Back to Website
    </a>

</div>

</body>

</html>
